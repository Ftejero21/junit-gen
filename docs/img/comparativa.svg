<title id="t">junit-gen frente a la IA sola con Haiku, Sonnet y Opus 5.5</title>
<desc id="d">Para cada modelo (Haiku, Sonnet, Opus 5.5, esfuerzo alto) y para 5, 15 y 25 servicios: tiempo, tokens y coste de la IA sola frente a junit-gen. junit-gen es más rápido y gasta menos en todos los casos; Sonnet 5.5 con junit-gen es la combinación más rápida (4,6 minutos con 25 servicios).</desc>
